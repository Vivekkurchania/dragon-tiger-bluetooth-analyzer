name: Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Sender APK
        run: ./gradlew :sender-app:assembleDebug

      - name: Build Analyzer APK
        run: ./gradlew :analyzer-app:assembleDebug

      - name: Prepare APKs
        run: |
          mkdir -p apk-output
          cp sender-app/build/outputs/apk/debug/*.apk apk-output/Dragon-Tiger-Sender.apk
          cp analyzer-app/build/outputs/apk/debug/*.apk apk-output/Dragon-Tiger-Analyzer.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dragon-tiger-apks
          path: apk-output/
          retention-days: 30
